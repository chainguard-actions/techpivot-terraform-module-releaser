name: Continuous Integration

on:
  pull_request:
    # Note: We only test our internal action locally in the pull request branch to avoid
    # actually creating releases for terraform modules in this primary github action
    # repository. Thus, we ensure that the "closed" option is not present. Separately,
    # we test the action as designed in a separate terraform-module repository.
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write # Required to create tags, create releases and update wiki
  pull-requests: write # Required to comment on pull requests

jobs:
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci --no-fund

      - name: Package
        id: npm-package
        run: npm run package

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          major-keywords: major change,breaking change
          minor-keywords: feat,feature
          patch-keywords: fix,chore,docs
          default-first-tag: v1.0.0
          disable-wiki: false
          wiki-sidebar-changelog-max: 10
          delete-legacy-tags: false # Note: We don't want to delete tags in this repository
          terraform-docs-version: v0.20.0
          module-path-ignore: tf-modules/kms/examples/complete,tf-modules/zoo,tf-modules/animal,tf-modules/s3-bucket-object
          module-change-exclude-patterns: .gitignore,*.md,*.tftest.hcl,tests/**,examples/**
          module-asset-exclude-patterns: .gitignore,*.md,*.tftest.hcl,tests/**
          use-ssh-source-format: true
          tag-directory-separator: "-"
          use-version-prefix: false

      - name: Test Action Outputs
        id: test-outputs
        env:
          CHANGED_MODULE_NAMES: ${{ steps.test-action.outputs.changed-module-names }}
          CHANGED_MODULE_PATHS: ${{ steps.test-action.outputs.changed-module-paths }}
          CHANGED_MODULES_MAP: ${{ steps.test-action.outputs.changed-modules-map }}
          ALL_MODULE_NAMES: ${{ steps.test-action.outputs.all-module-names }}
          ALL_MODULE_PATHS: ${{ steps.test-action.outputs.all-module-paths }}
          ALL_MODULES_MAP: ${{ steps.test-action.outputs.all-modules-map }}
        run: |
          echo "Testing action outputs..."

          # Test if outputs are set
          if [[ -n "$CHANGED_MODULE_NAMES" ]]; then
            echo "✅ Output 'changed-modules-names': $CHANGED_MODULE_NAMES"
          else
            echo "❌ No changed module names found"
          fi

          if [[ -n "$CHANGED_MODULE_PATHS" ]]; then
            echo "✅ Output 'changed-module-paths': $CHANGED_MODULE_PATHS"
          else
            echo "❌ No changed module paths found"
          fi

          if [[ -n "$CHANGED_MODULES_MAP" ]]; then
            echo "✅ Output 'changed-modules-map':"
            echo "$CHANGED_MODULES_MAP" | jq -r '
              "Found \(length) changed module(s):",
              (to_entries[] | 
                "• \(.key):",
                "  - Path: \(.value.path)",
                "  - Latest Tag: \(.value.latestTag)",
                "  - Next Tag: \(.value.nextTag)",
                "  - Release Type: \(.value.releaseType)"
              )
            '
          else
            echo "❌ No changed modules map found"
          fi

          # Silently validate JSON structure is an object
          echo "$CHANGED_MODULES_MAP" | jq -e 'type == "object"' > /dev/null || {
            echo "❌ Expected object type in changed-modules-map"
            exit 1
          }

          # Test new outputs for all modules
          if [[ -n "$ALL_MODULE_NAMES" ]]; then
            echo "✅ Output 'all-module-names': $ALL_MODULE_NAMES"
          else
            echo "❌ No all module names found"
          fi

          if [[ -n "$ALL_MODULE_PATHS" ]]; then
            echo "✅ Output 'all-module-paths': $ALL_MODULE_PATHS"
          else
            echo "❌ No all module paths found"
          fi

          if [[ -n "$ALL_MODULES_MAP" ]]; then
            echo "✅ Output 'all-modules-map':"
            echo "$ALL_MODULES_MAP" | jq -r '
              "Found \(length) total module(s):",
              (to_entries[] | 
                "• \(.key):",
                "  - Path: \(.value.path)",
                "  - Latest Tag: \(.value.latestTag)",
                "  - Latest Tag Version: \(.value.latestTagVersion)"
              )
            '
          else
            echo "❌ No all modules map found"
          fi

          # Silently validate JSON structure is an objects
          echo "$ALL_MODULES_MAP" | jq -e 'type == "object"' > /dev/null || {
            echo "❌ Expected object type in all-modules-map"
            exit 1
          }
