name: Test PR event with valid payload reaches API stage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event payload
        run: |
          # Create a minimal valid pull_request event payload
          # The action validates this payload structure before making API calls
          cat > /tmp/pr-event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 999999,
              "title": "Test PR for terraform-module-releaser",
              "body": "This is a test PR body",
              "merged": false,
              "head": {
                "sha": "abc123def456abc123def456abc123def456abc1"
              },
              "base": {
                "sha": "def456abc123def456abc123def456abc123def4"
              }
            },
            "repository": {
              "full_name": "${{ github.repository }}",
              "name": "${{ github.event.repository.name }}",
              "owner": {
                "login": "${{ github.repository_owner }}"
              }
            }
          }
          EOF
          echo "Created PR event payload at /tmp/pr-event.json"
          cat /tmp/pr-event.json

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/pr-event.json
        with:
          disable-wiki: "true"
          semver-mode: "conventional-commits"
          default-semver-level: "patch"
          default-first-tag: "v1.0.0"
          delete-legacy-tags: "false"

      - name: Assert action failed at API stage (not config/context stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because PR #999999 doesn't exist in the real repo.
          # This is expected - it proves config and context initialization succeeded.
          # If the action somehow succeeded (unlikely with a fake PR), that's also acceptable.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (likely at API call stage with non-existent PR)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
