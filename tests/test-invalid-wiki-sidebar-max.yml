name: Test invalid wiki-sidebar-changelog-max fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          wiki-sidebar-changelog-max: "0"
          github_token: fake-token-for-testing

      - name: Assert action failed due to invalid config
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with wiki-sidebar-changelog-max=0"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid wiki-sidebar-changelog-max"
