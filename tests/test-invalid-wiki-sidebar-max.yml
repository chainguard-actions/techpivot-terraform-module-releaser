name: Test invalid wiki-sidebar-changelog-max fails with validation error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
        with:
          wiki-sidebar-changelog-max: "0"
          disable-wiki: "true"

      - name: Assert action failed due to invalid wiki-sidebar-changelog-max
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with wiki-sidebar-changelog-max=0, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid wiki-sidebar-changelog-max=0"
