name: Test non-PR event fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake push event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/push.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/event/push.json" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-non-pr-test
          disable-wiki: "true"
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: /tmp/event/push.json

      - name: Assert action failed for non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside a pull_request event"
            exit 1
          fi
          echo "PASS: action correctly failed for non-PR event"
