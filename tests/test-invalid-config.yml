name: Test invalid configuration rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-invalid-separator
        name: Run action with invalid tag-directory-separator
        uses: .
        continue-on-error: true
        with:
          tag-directory-separator: "!"
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to invalid tag-directory-separator
        env:
          OUTCOME: ${{ steps.action-invalid-separator.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid tag-directory-separator, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid tag-directory-separator"

      - id: action-invalid-semver
        name: Run action with invalid default-semver-level
        uses: .
        continue-on-error: true
        with:
          default-semver-level: "invalid"
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to invalid default-semver-level
        env:
          OUTCOME: ${{ steps.action-invalid-semver.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid default-semver-level, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid default-semver-level"

      - id: action-invalid-first-tag
        name: Run action with invalid default-first-tag format
        uses: .
        continue-on-error: true
        with:
          default-first-tag: "invalid-tag"
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to invalid default-first-tag
        env:
          OUTCOME: ${{ steps.action-invalid-first-tag.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid default-first-tag, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid default-first-tag"
