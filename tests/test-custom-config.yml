name: Test custom configuration options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          semver-mode: conventional-commits
          default-semver-level: minor
          default-first-tag: v0.1.0
          terraform-docs-version: v0.19.0
          delete-legacy-tags: "false"
          disable-wiki: "true"
          wiki-sidebar-changelog-max: "10"
          disable-branding: "true"
          module-path-ignore: "examples,examples/**"
          module-change-exclude-patterns: ".gitignore,*.md,*.tftest.hcl,tests/**"
          module-asset-exclude-patterns: ".gitignore,*.md,*.tftest.hcl,tests/**"
          use-ssh-source-format: "false"
          tag-directory-separator: /
          use-version-prefix: "true"
          module-ref-mode: tag
          pre-release: "false"
          hide-no-changes-pr-comment: "true"
          github_token: ${{ github.token }}

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ALL_MODULE_NAMES: ${{ steps.action.outputs.all-module-names }}
          ALL_MODULE_PATHS: ${{ steps.action.outputs.all-module-paths }}
          ALL_MODULES_MAP: ${{ steps.action.outputs.all-modules-map }}
        run: |
          echo "outcome: $OUTCOME"
          echo "all-module-names: $ALL_MODULE_NAMES"
          echo "all-module-paths: $ALL_MODULE_PATHS"
          echo "all-modules-map: $ALL_MODULES_MAP"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
