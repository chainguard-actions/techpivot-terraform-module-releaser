name: Test excluding *.tf files from module-change-exclude-patterns fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with *.tf in module-change-exclude-patterns expecting failure
        id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/techpivot--terraform-module-releaser/v2.0.0/tests/fixtures/pr-event.json
        with:
          github_token: fake-token-for-testing
          module-change-exclude-patterns: "*.tf,*.md"
          disable-wiki: "true"
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when *.tf is in module-change-exclude-patterns, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected *.tf in module-change-exclude-patterns"
