name: Test invalid default-first-tag format fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/pr.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "body": "Test body",
              "merged": false
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-config-test
          default-first-tag: "invalid-tag"
          disable-wiki: "true"
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: /tmp/event/pr.json

      - name: Assert action failed for invalid default-first-tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when default-first-tag is 'invalid-tag'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid default-first-tag format"
