name: Test invalid default-first-tag format fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          default-first-tag: "not-a-valid-tag"
          github_token: fake-token-for-testing

      - name: Assert action failed due to invalid default-first-tag
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid default-first-tag 'not-a-valid-tag'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid default-first-tag format"
