name: Test use-version-prefix disabled with v-prefixed default-first-tag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: feature-no-prefix
      GITHUB_BASE_REF: main
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json << 'EOF'
          {
            "action": "opened",
            "number": 2,
            "pull_request": {
              "number": 2,
              "title": "feat: test version prefix disabled",
              "body": "Testing version prefix disabled",
              "merged": false,
              "head": {
                "ref": "feature-no-prefix",
                "sha": "abc123"
              },
              "base": {
                "ref": "main",
                "sha": "def456"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-event/event.json
        with:
          github_token: fake-token-for-testing
          use-version-prefix: "false"
          default-first-tag: "v1.0.0"
          disable-wiki: "true"

      - name: Assert action did not fail due to config validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the API call stage (fake token), not at config validation.
          # use-version-prefix=false with default-first-tag=v1.0.0 is valid - the 'v' is stripped automatically.
          # If it fails, it should be due to API errors, not config errors.
          echo "PASS: use-version-prefix=false with v-prefixed default-first-tag is valid config"
