name: Test advanced configuration options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-advanced
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          semver-mode: conventional-commits
          default-semver-level: minor
          default-first-tag: v0.1.0
          terraform-docs-version: v0.21.0
          delete-legacy-tags: "false"
          disable-wiki: "true"
          wiki-sidebar-changelog-max: "10"
          disable-branding: "true"
          module-path-ignore: "examples,examples/**"
          module-change-exclude-patterns: ".gitignore,*.md,*.tftest.hcl,tests/**"
          module-asset-exclude-patterns: ".gitignore,*.md,*.tftest.hcl,tests/**"
          use-ssh-source-format: "false"
          tag-directory-separator: "/"
          use-version-prefix: "true"
          module-ref-mode: "tag"
          pre-release: "false"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran without unexpected crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME (success or failure both acceptable in test env)"
