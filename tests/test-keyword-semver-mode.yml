name: Test keyword semver mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          semver-mode: keywords
          major-keywords: breaking change,major change
          minor-keywords: feat,feature,new
          patch-keywords: fix,chore,docs,refactor
          default-semver-level: patch
          github_token: ${{ github.token }}

      - name: Assert action ran with keyword semver mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ALL_MODULE_NAMES: ${{ steps.action.outputs.all-module-names }}
        run: |
          echo "outcome: $OUTCOME"
          echo "all-module-names: $ALL_MODULE_NAMES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with keyword semver mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
