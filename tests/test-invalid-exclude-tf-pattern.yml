name: Test module-change-exclude-patterns with *.tf fails validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
        with:
          module-change-exclude-patterns: "*.tf,*.md"
          disable-wiki: "true"

      - name: Assert action failed due to *.tf in exclude patterns
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when *.tf is in module-change-exclude-patterns, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when *.tf was included in module-change-exclude-patterns"
