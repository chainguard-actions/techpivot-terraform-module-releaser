name: Test no version prefix and underscore tag separator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          semver-mode: conventional-commits
          default-semver-level: patch
          default-first-tag: v1.0.0
          use-version-prefix: "false"
          tag-directory-separator: "_"
          module-ref-mode: tag
          disable-wiki: "true"
          delete-legacy-tags: "false"
          github_token: ${{ github.token }}

      - name: Assert action ran with no version prefix
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ALL_MODULE_NAMES: ${{ steps.action.outputs.all-module-names }}
          ALL_MODULES_MAP: ${{ steps.action.outputs.all-modules-map }}
        run: |
          echo "outcome: $OUTCOME"
          echo "all-module-names: $ALL_MODULE_NAMES"
          echo "all-modules-map: $ALL_MODULES_MAP"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no version prefix"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
