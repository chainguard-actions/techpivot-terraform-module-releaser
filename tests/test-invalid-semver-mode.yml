name: Test invalid semver-mode fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/gh-event
          cat > /tmp/gh-event/pull_request.json << 'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "body": "Test body",
              "merged": false,
              "head": {
                "sha": "abc123def456abc123def456abc123def456abc1",
                "ref": "feature/test"
              },
              "base": {
                "sha": "def456abc123def456abc123def456abc123def4",
                "ref": "main"
              }
            },
            "repository": {
              "full_name": "${{ github.repository }}",
              "name": "${{ github.event.repository.name }}",
              "owner": {
                "login": "${{ github.repository_owner }}"
              }
            },
            "sender": {
              "login": "test-user"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/gh-event/pull_request.json
        with:
          github_token: ${{ github.token }}
          semver-mode: invalid-mode
          disable-wiki: "true"

      - name: Assert action failed due to invalid semver-mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid semver-mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid semver-mode"
