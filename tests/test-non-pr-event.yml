name: Test non-PR event rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with non-PR event (workflow_dispatch)
        uses: .
        continue-on-error: true
        with:
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by a pull_request event, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not triggered by a pull_request event"
