name: Test PR merge event handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake merged PR event payload
        run: |
          mkdir -p /tmp/gh-event
          cat > /tmp/gh-event/pull_request_merged.json << 'EOF'
          {
            "action": "closed",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "feat: add new terraform module",
              "body": "This PR adds a new terraform module",
              "merged": true,
              "head": {
                "sha": "abc123def456abc123def456abc123def456abc1",
                "ref": "feature/new-module"
              },
              "base": {
                "sha": "def456abc123def456abc123def456abc123def4",
                "ref": "main"
              }
            },
            "repository": {
              "full_name": "${{ github.repository }}",
              "name": "${{ github.event.repository.name }}",
              "owner": {
                "login": "${{ github.repository_owner }}"
              }
            },
            "sender": {
              "login": "test-user"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/gh-event/pull_request_merged.json
        with:
          github_token: ${{ github.token }}
          disable-wiki: "true"
          delete-legacy-tags: "false"
          semver-mode: conventional-commits
          default-first-tag: v1.0.0

      - name: Assert action processed merge event (not a config/context error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to API calls (PR #1 may not exist).
          # The important thing is it got past context initialization and recognized the merge event.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action processed the merged PR event (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
