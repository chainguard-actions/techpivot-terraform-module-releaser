name: Test version prefix configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-no-prefix
        name: Run action with use-version-prefix=false (valid config)
        uses: .
        continue-on-error: true
        with:
          use-version-prefix: "false"
          default-first-tag: "v1.0.0"
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to non-PR event (not config error)
        env:
          OUTCOME: ${{ steps.action-no-prefix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because we're not in a PR context (workflow_dispatch),
          # NOT because of a config error. Either way, outcome is 'failure', but
          # the important thing is that use-version-prefix=false with default-first-tag=v1.0.0
          # is a valid configuration (the 'v' is stripped automatically).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (non-PR event), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (non-PR event, config was valid)"

      - id: action-with-prefix
        name: Run action with use-version-prefix=true (default, valid config)
        uses: .
        continue-on-error: true
        with:
          use-version-prefix: "true"
          default-first-tag: "v1.0.0"
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to non-PR event (not config error)
        env:
          OUTCOME: ${{ steps.action-with-prefix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (non-PR event), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (non-PR event, config was valid)"

      - id: action-invalid-ref-mode
        name: Run action with invalid module-ref-mode
        uses: .
        continue-on-error: true
        with:
          module-ref-mode: "invalid-mode"
          disable-wiki: "true"
          github_token: ${{ github.token }}

      - name: Assert action failed due to invalid module-ref-mode
        env:
          OUTCOME: ${{ steps.action-invalid-ref-mode.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid module-ref-mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid module-ref-mode"
