name: Test invalid default-semver-level fails with validation error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
        with:
          default-semver-level: "extreme"
          disable-wiki: "true"

      - name: Assert action failed due to invalid default-semver-level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid default-semver-level 'extreme', but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid default-semver-level input"
