name: Test config validation - invalid tag-directory-separator
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Config is initialized before context, so an invalid config causes failure
      # before the action even checks the event name. No PR event payload needed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          disable-wiki: "true"
          # Use an invalid separator (not one of /, -, _, .)
          tag-directory-separator: "@"

      - name: Assert action failed due to invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid tag-directory-separator '@'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid tag-directory-separator"
