name: Test basic usage with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ALL_MODULE_NAMES: ${{ steps.action.outputs.all-module-names }}
          ALL_MODULE_PATHS: ${{ steps.action.outputs.all-module-paths }}
        run: |
          echo "outcome: $OUTCOME"
          echo "all-module-names: $ALL_MODULE_NAMES"
          echo "all-module-paths: $ALL_MODULE_PATHS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
